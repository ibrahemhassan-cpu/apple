<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="g-shine">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6DBE5A"/>
      <stop offset=".45" stop-color="#3F8A45"/>
      <stop offset="1" stop-color="#2C6636"/>
    </linearGradient>
  <!--FRUIT_DEFS-->
  </defs>
</svg>

<main id="stage">
  <div class="sky sky-night"></div>
  <div class="sky sky-dawn"></div>
  <div class="sky sky-day"></div>
  <canvas id="bg" class="layer"></canvas>

  <div id="far" class="layer">
    <div id="sunwrap"><div class="rays"></div><div class="sun"></div></div>
    <svg class="cloud c1" viewBox="0 0 200 80"><path d="M20,70 C0,70 0,44 22,42 C22,20 52,12 66,30 C74,8 116,6 124,34 C140,20 170,26 170,48 C192,48 196,70 176,70 Z"/></svg>
    <svg class="cloud c2" viewBox="0 0 200 80"><path d="M20,70 C0,70 0,44 22,42 C22,20 52,12 66,30 C74,8 116,6 124,34 C140,20 170,26 170,48 C192,48 196,70 176,70 Z"/></svg>
    <svg class="cloud c3" viewBox="0 0 200 80"><path d="M20,70 C0,70 0,44 22,42 C22,20 52,12 66,30 C74,8 116,6 124,34 C140,20 170,26 170,48 C192,48 196,70 176,70 Z"/></svg>
    <svg class="cloud c4" viewBox="0 0 200 80"><path d="M20,70 C0,70 0,44 22,42 C22,20 52,12 66,30 C74,8 116,6 124,34 C140,20 170,26 170,48 C192,48 196,70 176,70 Z"/></svg>
    <svg id="mountains" viewBox="0 0 1600 400" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0,250 C120,170 220,150 330,210 C430,120 560,90 680,190 C780,140 880,130 980,200 C1100,110 1240,100 1360,190 C1450,150 1540,160 1600,190 L1600,400 L0,400 Z" fill="#A9BEDD"/>
      <path d="M0,320 C200,250 380,300 560,270 C760,236 900,300 1100,280 C1300,260 1450,300 1600,280 L1600,400 L0,400 Z" fill="#93C6B6"/>
    </svg>
  </div>

  <div id="world">
    <svg id="scene-back" viewBox="0 0 800 1800" preserveAspectRatio="none" aria-hidden="true">
      <path d="M-2000,1640 C-1100,1500 -700,1560 -300,1600 C100,1640 300,1540 700,1530 C1100,1520 1500,1620 2800,1580 L2800,1800 L-2000,1800 Z" fill="#B5DC8E"/>
      <path d="M-2000,1700 C-1000,1600 -500,1680 0,1690 C300,1696 600,1640 1000,1650 C1500,1662 1900,1700 2800,1680 L2800,1800 L-2000,1800 Z" fill="#86C46A"/>
    </svg>
    <!-- the tree or plant itself, grown in 3D (flora3d.js) between the far hills and the rest of the scene -->
    <canvas id="flora" aria-hidden="true"></canvas>
    <svg id="scene" viewBox="0 0 800 1800" preserveAspectRatio="none" aria-hidden="true">
      <g id="plant" style="visibility:hidden"></g>

      <g id="sprout" style="visibility:hidden">
        <path d="M400,1754 C400,1734 397,1716 402,1698" fill="none" stroke="#5BAF4E" stroke-width="6" stroke-linecap="round"/>
        <path d="M401,1704 C386,1690 368,1694 362,1704 C374,1714 390,1714 401,1704 Z" fill="#7BC46A"/>
        <path d="M402,1700 C414,1684 434,1684 442,1694 C432,1706 414,1708 402,1700 Z" fill="#7BC46A"/>
      </g>
      <ellipse id="ripple" cx="400" cy="1752" rx="60" ry="13" fill="none" stroke="#FFE7A3" stroke-width="4" opacity="0"/>

      <path id="ground-path" fill="url(#g-ground)" d="M-2000,1752 C-900,1700 -300,1770 200,1748 C500,1734 800,1762 1100,1744 C1600,1720 2000,1760 2800,1740 L2800,1800 L-2000,1800 Z"/>
      <ellipse id="plant-shade" cx="400" cy="1757" rx="0" ry="0" fill="#1D4A2A" opacity=".26"/>
      <g id="underground" style="visibility:hidden"></g>
      <g id="tufts"></g>

      <g id="dig" style="visibility:hidden">
        <ellipse id="mound" cx="492" cy="1750" rx="0" ry="0" fill="#6B4A2A"/>
        <ellipse id="hole" cx="400" cy="1748" rx="0" ry="0" fill="#3E2A17"/>
        <ellipse id="hole-wet" cx="400" cy="1748" rx="0" ry="0" fill="#241608" opacity="0"/>
        <circle id="dig-ring" cx="400" cy="1746" r="58" fill="none" stroke="#FFF4DF" stroke-width="5" stroke-dasharray="14 12" opacity="0"/>
        <circle id="dig-hit" cx="400" cy="1744" r="96" fill="transparent"/>
      </g>

      <g id="ladder" style="visibility:hidden">
        <g id="ladder-rungs"></g>
        <g id="ladder-hits"></g>
        <path class="rail" d="M391,892 L482,1760"/>
        <path class="rail" d="M467,892 L558,1760"/>
        <path class="rail-hi" d="M388,896 L478,1756"/>
        <path class="rail-hi" d="M464,896 L554,1756"/>
      </g>

      <ellipse id="kidShadow" cx="-500" cy="1758" rx="44" ry="9" fill="#1D4A2A" opacity="0" style="visibility:hidden"/>
      <g id="kid" style="visibility:hidden">
        <line id="thighL" class="leg" x1="-14" y1="-80"/>
        <line id="shinL" class="leg"/>
        <ellipse id="shoeL" class="shoe" rx="13" ry="8"/>
        <line id="thighR" class="leg" x1="14" y1="-80"/>
        <line id="shinR" class="leg"/>
        <ellipse id="shoeR" class="shoe" rx="13" ry="8"/>
        <path d="M-30,-94 L30,-94 L32,-70 C20,-63 -20,-63 -32,-70 Z" fill="#2D4A7C"/>
        <line id="armL" class="arm" x1="-24" y1="-142"/>
        <circle id="handL" class="hand" r="9.5"/>
        <line id="armR" class="arm" x1="24" y1="-142"/>
        <circle id="handR" class="hand" r="9.5"/>
        <path d="M-31,-152 C-36,-126 -36,-98 -31,-84 C-18,-78 18,-78 31,-84 C36,-98 36,-126 31,-152 C20,-162 -20,-162 -31,-152 Z" fill="#F2A541"/>
        <path d="M-20,-156 C-18,-132 18,-132 20,-156 Z" fill="#E08F2C"/>
        <path d="M-15,-104 L15,-104" stroke="#E08F2C" stroke-width="4" stroke-linecap="round"/>
        <g id="kidHead">
          <circle cx="-31" cy="-180" r="7" fill="#F0BE96"/>
          <circle cx="31" cy="-180" r="7" fill="#F0BE96"/>
          <circle cx="0" cy="-184" r="32" fill="#3A2A22"/>
          <g id="kidFace" style="display:none">
            <circle cx="0" cy="-182" r="31" fill="#F3C9A4"/>
            <path d="M-32,-186 C-30,-214 30,-214 32,-186 C20,-197 8,-190 0,-197 C-8,-190 -20,-197 -32,-186 Z" fill="#3A2A22"/>
            <path d="M-16,-178 Q-11,-186 -6,-178 M6,-178 Q11,-186 16,-178" fill="none" stroke="#1B1F3B" stroke-width="3.2" stroke-linecap="round"/>
            <circle cx="-20" cy="-167" r="5.5" fill="#FF8F8F" opacity=".6"/>
            <circle cx="20" cy="-167" r="5.5" fill="#FF8F8F" opacity=".6"/>
            <path d="M-10,-167 Q0,-154 10,-167 Z" fill="#8E2331" stroke="#1B1F3B" stroke-width="2.5" stroke-linejoin="round"/>
          </g>
          <path d="M-34,-190 C-32,-226 32,-226 34,-190 Z" fill="#D7263D"/>
          <rect x="-36" y="-198" width="72" height="13" rx="6.5" fill="#B01C30"/>
          <circle cx="0" cy="-226" r="8" fill="#FFF4DF"/>
        </g>
      </g>

      <g id="pole" style="visibility:hidden">
        <line id="pole-stick" x1="0" y1="0" x2="0" y2="0" stroke="#6B4423" stroke-width="12" stroke-linecap="round"/>
        <line id="pole-shine" x1="0" y1="0" x2="0" y2="0" stroke="#D9A866" stroke-width="4" stroke-linecap="round"/>
        <g id="pole-net">
          <path d="M-30,-2 C-28,40 28,40 30,-2" fill="rgba(255,244,223,.35)" stroke="#FFF4DF" stroke-width="3" stroke-dasharray="6 5"/>
          <ellipse cx="0" cy="-2" rx="30" ry="8" fill="none" stroke="#C9955A" stroke-width="5"/>
        </g>
      </g>
    </svg>
    <!-- the fruit in 3D (fruit3d.js), drawn above the scene; the nodes in #fruits still take the taps -->
    <canvas id="fruit3d" aria-hidden="true"></canvas>
    <div id="fruits"></div>
    <div id="flutters"></div>
  </div>

  <div id="tint" class="layer"></div>

  <section id="intro" class="layer">
    <p class="eyebrow" data-i18n="eyebrow">حكاية من بستان صغير</p>
    <h1 id="title" data-i18n="title">بستان التفاحة</h1>
    <button id="fruit-btn" type="button" data-i18n-aria="openAria" aria-label="افتح التفاحة">
      <span class="fruit-glow"></span>
      <span class="fruit-shadow"></span>
      <span class="fruit-float">
        <span class="fruit-tilt">
          <span class="fruit-squash">
            <!--FRUIT_INTRO-->
            <span class="flash"></span>
          </span>
        </span>
      </span>
    </button>
    <p id="tap-hint" data-i18n="tapHint">دوس على التفاحة</p>
  </section>

  <canvas id="fx" class="layer"></canvas>

  <div id="hud" class="layer">
    <button id="home" type="button" data-i18n-aria="home" aria-label="البستان">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v9.5h4.5v-5.5h4v5.5h4.5V10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg>
    </button>
    <button id="lang" type="button" data-i18n-aria="langAria" aria-label="English">EN</button>
    <button id="sound" type="button" aria-pressed="true" data-i18n-aria="soundAria" aria-label="الصوت">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="mute" d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="captions">
      <h2 id="caption"></h2>
      <p id="subcaption"></p>
      <div id="climb-controls">
        <button id="climb-all" type="button">
          <span data-i18n="goTop">اطلع للآخر</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
    <div id="steer">
      <button id="btn-up" type="button" data-i18n-aria="upAria" aria-label="اطلع درجة">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15l7-7 7 7" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span id="rungs">٠ / ١٢</span>
      <button id="btn-down" type="button" data-i18n-aria="downAria" aria-label="انزل درجة">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div id="basket">
      <div class="basket-tag"><b id="count">٠</b> <span id="count-of">من ١٠</span></div>
      <div class="basket-body">
        <svg class="b-back" viewBox="0 0 260 230" aria-hidden="true">
          <ellipse cx="130" cy="222" rx="96" ry="8" fill="#000" opacity=".18"/>
          <path d="M36,104 C36,8 224,8 224,104" fill="none" stroke="#8E5526" stroke-width="12" stroke-linecap="round"/>
          <path d="M36,104 C36,8 224,8 224,104" fill="none" stroke="#D9994F" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round"/>
          <ellipse cx="130" cy="104" rx="112" ry="28" fill="#5A3418"/>
          <path d="M18,104 A112,28 0 0 1 242,104" fill="none" stroke="#B97436" stroke-width="12"/>
        </svg>
        <div class="b-fruits"></div>
        <svg class="b-front" viewBox="0 0 260 230" aria-hidden="true">
          <defs>
            <linearGradient id="g-wicker" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6A862"/><stop offset="1" stop-color="#9C5E2A"/></linearGradient>
            <clipPath id="c-basket"><path d="M18,104 A112,28 0 0 0 242,104 L214,214 Q130,236 46,214 Z"/></clipPath>
          </defs>
          <path d="M18,104 A112,28 0 0 0 242,104 L214,214 Q130,236 46,214 Z" fill="url(#g-wicker)"/>
          <g clip-path="url(#c-basket)" fill="none">
            <g stroke="#8E5526" stroke-width="4" opacity=".5">
              <path d="M0,156 Q130,188 260,156"/><path d="M0,182 Q130,212 260,182"/><path d="M0,206 Q130,236 260,206"/>
              <path d="M52,120 L64,226"/><path d="M78,126 L86,228"/><path d="M104,130 L108,230"/><path d="M130,132 L130,232"/><path d="M156,130 L152,230"/><path d="M182,126 L174,228"/><path d="M208,120 L196,226"/>
            </g>
            <g stroke="#F4C487" stroke-width="6" stroke-dasharray="13 13" opacity=".45">
              <path d="M0,168 Q130,200 260,168"/><path d="M0,194 Q130,224 260,194" stroke-dashoffset="13"/>
            </g>
          </g>
          <path d="M18,104 A112,28 0 0 0 242,104" fill="none" stroke="#8E5526" stroke-width="14" stroke-linecap="round"/>
          <path d="M24,108 A106,25 0 0 0 236,108" fill="none" stroke="#DDA15A" stroke-width="4" stroke-dasharray="12 9"/>
        </svg>
      </div>
    </div>
    <p id="bravo" data-i18n="bravo" aria-hidden="true">برافووو</p>
    <div id="finale" role="dialog" aria-labelledby="finale-title">
      <h2 id="finale-title" data-i18n="finaleTitle">برافو! السلة اتملت</h2>
      <p data-i18n="finaleBody">قطفت ١٠ تفاحات من الشجرة اللي زرعتها بنفسك.</p>
      <div class="finale-actions">
        <button id="replay" type="button" data-i18n="replay">ازرع تفاحة جديدة</button>
        <button id="to-orchard" type="button" data-i18n="home">البستان</button>
      </div>
    </div>
  </div>

  <div id="overlay" class="layer">
    <div id="seed" role="button" tabindex="-1" data-i18n-aria="seedAria" aria-label="ازرع البذرة"><span class="seed-ring"></span><span class="seed-glow"></span><!--FRUIT_SEED--></div>
    <div id="can" role="button" tabindex="-1" aria-hidden="true">
      <svg viewBox="0 0 120 100" aria-hidden="true">
        <path d="M34,34 C34,18 62,18 62,34" fill="none" stroke="#3F7FA6" stroke-width="9" stroke-linecap="round"/>
        <path d="M30,36 L78,36 L72,84 C71,90 66,92 54,92 C42,92 37,90 36,84 Z" fill="#5BA7CE"/>
        <path d="M30,36 L78,36 L76,50 L32,50 Z" fill="#7FC4E4"/>
        <path d="M78,46 L104,28 L112,34 L86,58 Z" fill="#4E97BD"/>
        <path d="M104,26 L118,22 L114,38 L100,36 Z" fill="#7FC4E4"/>
        <circle cx="52" cy="66" r="9" fill="#FFF4DF" opacity=".5"/>
      </svg>
    </div>
    <svg id="hand" viewBox="0 0 48 56" aria-hidden="true"><path d="M17 30V8a4.5 4.5 0 0 1 9 0v14l2-.6a4.5 4.5 0 0 1 5 2.6l.5-.2a4.3 4.3 0 0 1 5.5 2.8 4.3 4.3 0 0 1 5 4V41c0 8-6 13-14 13h-3c-5 0-8-2-11-6L7 38a4 4 0 0 1 6-5z" fill="#FFF4DF" stroke="#1B1F3B" stroke-width="3" stroke-linejoin="round"/></svg>
  </div>
</main>
